<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim+ | Histórico</title>
<link rel="stylesheet" href="paginas.css">
<style>
  .barra {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    margin: 20px 0 4px;
  }
  .barra p { margin: 0; }
  .registro { padding: 18px 0; border-bottom: 1px solid var(--linha); }
  .registro h3 { margin: 0; font-size: 16px; }
  .registro .meta { margin: 2px 0 8px; }
  .desfeito { color: var(--vermelho); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--linha); }
  th { font-size: 13px; font-weight: 600; color: var(--tinta-suave); }
  td.num, th.num { width: 3.5em; }
  td.nota, th.nota { width: 5.5em; }
  tr:last-child td { border-bottom: 0; }
  .vazio { padding: 40px 0; }
</style>
</head>
<body>
  <header class="diario">
    <div>
      <h1>Histórico</h1>
      <p>Notas alteradas pelo Boletim+ neste computador</p>
    </div>
  </header>

  <main>
    <div class="barra">
      <p class="suave" id="contagem"></p>
      <button type="button" class="perigo" id="apagar" hidden>Apagar histórico</button>
    </div>
    <div id="lista" aria-live="polite"></div>
  </main>

  <script src="historico.js"></script>
</body>
</html>
